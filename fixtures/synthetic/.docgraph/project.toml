schema_version = 1

[project]
name = "Synthetic ontology conformance"

[documents]
root = "docs"

[agent_instructions]
targets = ["AGENTS.md", "CLAUDE.md"]

[query.grommit_targets]
description = "Targets grommitted by a florp."
predicate = "grommit_target"
arguments = [
  { name = "florp", mode = "input", type = "entity" },
  { name = "target", mode = "output", type = "string" },
]

[query.scalar_values]
description = "Exercises typed result transport."
predicate = "scalar_values"
arguments = [
  { name = "integer", mode = "output", type = "integer" },
  { name = "float", mode = "output", type = "float" },
  { name = "boolean", mode = "output", type = "boolean" },
  { name = "text", mode = "output", type = "string" },
]

[query.grommit_confidence]
description = "Returns a typed relation property."
predicate = "grommit_confidence"
arguments = [
  { name = "florp", mode = "input", type = "entity" },
  { name = "confidence", mode = "output", type = "float" },
]

[query.florp_details]
description = "Returns typed entity properties and expanded array items."
predicate = "florp_details"
arguments = [
  { name = "florp", mode = "input", type = "entity" },
  { name = "title", mode = "output", type = "string" },
  { name = "count", mode = "output", type = "integer" },
  { name = "score", mode = "output", type = "float" },
  { name = "enabled", mode = "output", type = "boolean" },
  { name = "observed", mode = "output", type = "datetime" },
  { name = "label", mode = "output", type = "string" },
]

[query.reachable_florps]
description = "Returns the transitive precedence closure from a florp."
predicate = "reachable_florp"
arguments = [
  { name = "source", mode = "input", type = "entity" },
  { name = "target", mode = "output", type = "entity" },
]

[query.ready_florps]
description = "Returns florps with no incoming precedence edge."
predicate = "ready_florp"
arguments = [
  { name = "florp", mode = "output", type = "entity" },
]
