[entity.florp]
description = "A deliberately unfamiliar entity type."
workflow = "florp"

[entity.florp.property.title]
type = "string"

[entity.florp.property.count]
type = "integer"

[entity.florp.property.score]
type = "float"

[entity.florp.property.enabled]
type = "boolean"

[entity.florp.property.observed]
type = "datetime"

[entity.florp.property.labels]
type = "array"
items = "string"

[entity.florp.property.related]
type = "array"
items = "string"

[entity.grommit]
description = "A second unfamiliar entity type with an independent workflow."
workflow = "grommit"

[entity.grommit.property.title]
type = "string"
required = true

[entity.grommit.property.mode]
type = "string"
values = ["soft", "hard"]
