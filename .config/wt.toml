# Seed expensive ignored artifacts while mise installs the pinned toolchain in the background.
[post-start]
cache = "wt step copy-ignored --require-include"
tools = "mise install"

# Keep commit-time checks quick and independent.
[pre-commit]
format = "mise run fmt"
lint = "mise run lint"
managed-metadata = "mise run managed-changes"

# Run the complete test suite before merging.
[pre-merge]
test = "mise run test"
