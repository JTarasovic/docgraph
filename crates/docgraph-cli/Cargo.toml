[package]
name = "docgraph-cli"
description = "Command-line interface for docgraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "docgraph"
path = "src/main.rs"

[dependencies]
clap.workspace = true
docgraph-core.workspace = true
docgraph-logic.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true

[dev-dependencies]
serde_yaml_ng.workspace = true

[package.metadata.dist]
dist = true

[package.metadata.release]
pre-release-replacements = [
  { file = "../../skills/docgraph/skill.toml", search = 'cli_version = "[^"]+"', replace = 'cli_version = "{{version}}"', exactly = 1 },
  { file = "../../CHANGELOG.md", search = '(?m)^\[Unreleased\]: https://github\.com/JTarasovic/docgraph/compare/v([^\s]+)\.\.HEAD$', replace = '''[Unreleased]: https://github.com/JTarasovic/docgraph/compare/v{{version}}..HEAD
[{{version}}]: https://github.com/JTarasovic/docgraph/compare/v$1..v{{version}}''', exactly = 1 },
]
pre-release-hook = [
  "bash",
  "../../tools/release/update-changelog.sh",
  "{{version}}",
]
