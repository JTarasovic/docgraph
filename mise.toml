[tools]
rust = "1.98.0"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-llvm-cov" = "0.9.0"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-nextest" = "0.9.143"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Lint all Rust targets"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run the Rust test suite"
run = "cargo nextest run --workspace --all-features --no-tests pass"

[tasks.check]
description = "Run the default local checks"
depends = ["fmt", "lint", "test"]

[tasks.audit]
description = "Audit dependency advisories"
run = "cargo audit"

[tasks.deny]
description = "Check dependency policy"
run = "cargo deny check"

[tasks.machete]
description = "Check for unused dependencies"
run = "cargo machete"
