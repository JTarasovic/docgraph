[settings]
cargo.binstall_native = true
cargo.binstall_only = true

[env]
DOCGRAPH_LOGIC_RUNTIME = { default = "{{config_root}}/target/logic-runtime/{{os()}}-x86_64/docgraph-logic-runtime{% if os() == 'windows' %}.exe{% endif %}" }

[tools]
rust = { version = "1.98.0", profile = "minimal", components = ["rustfmt", "clippy"] }
cargo-binstall = "1.20.0"
"cargo:cargo-deny" = { version = "0.20.2", depends = ["cargo-binstall", "rust"] }
"cargo:cargo-machete" = { version = "0.9.2", depends = ["cargo-binstall", "rust"] }
"cargo:cargo-nextest" = { version = "0.9.143", depends = ["cargo-binstall", "rust"] }

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Lint all Rust targets"
run = "cargo clippy --workspace --all-targets --all-features --locked --no-deps -- -D warnings"

[tasks.test]
description = "Run the Rust test suite"
run = "cargo nextest run --workspace --all-features --locked --no-tests pass"

[tasks.check]
description = "Run every platform-independent required check"
depends = ["fmt", "lint", "test", "managed-changes", "deny", "machete"]

[tasks.check-local]
description = "Prepare the host runtime and run every required check"
run = [
    { task = "logic-runtime-linux" },
    { task = "check" },
]
run_windows = [
    { task = "logic-runtime-windows" },
    { task = "check" },
]

[tasks.windows-e2e]
description = "Run the shared test suite against the Windows runtime"
run = [{ task = "test" }]

[tasks.managed-changes]
description = "Reject unsupported managed metadata changes"
run = "cargo run --quiet --locked -p docgraph-cli -- validate --changes \"{{ get_env(name='DOCGRAPH_CHANGE_BASE', default='HEAD') }}\""

[tasks.deny]
description = "Check dependency policy"
run = "cargo deny check"

[tasks.machete]
description = "Check for unused dependencies"
run = "cargo machete"

[tasks.logic-runtime-windows]
description = "Build the pinned native Windows logic runtime"
run = "pwsh -NoProfile -File tools/logic-runtime/build-windows.ps1"

[tasks.logic-runtime-linux]
description = "Build the pinned native Linux logic runtime"
run = "bash tools/logic-runtime/build-linux.sh"
