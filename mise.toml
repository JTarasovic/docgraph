[tools]
rust = "1.98.0"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-nextest" = "0.9.143"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Lint all Rust targets"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks.test]
description = "Run the Rust test suite"
depends = ["logic-runtime-windows"]
env = { DOCGRAPH_LOGIC_RUNTIME = "{{config_root}}/target/logic-runtime/windows-x86_64/docgraph-logic-runtime.exe" }
run = "cargo nextest run --workspace --all-features --locked --no-tests pass"

[tasks.check]
description = "Run the default local checks"
depends = ["fmt", "lint", "test"]

[tasks.deny]
description = "Check dependency policy"
run = "cargo deny check"

[tasks.machete]
description = "Check for unused dependencies"
run = "cargo machete"

[tasks.logic-runtime-windows]
description = "Build the pinned native Windows logic runtime"
run = "pwsh -NoProfile -File tools/logic-runtime/build-windows.ps1"
