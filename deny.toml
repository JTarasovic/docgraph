[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0041", reason = "Cozo swap data is internal, self-produced, and decompressed into fresh buffers." },
  { id = "RUSTSEC-2025-0056", reason = "Unmaintained transitive dependency of Cozo 0.7.6; no patched compatible release." },
  { id = "RUSTSEC-2025-0141", reason = "Unmaintained transitive dependency of Cozo 0.7.6; no patched compatible release." },
  { id = "RUSTSEC-2025-0057", reason = "Unmaintained transitive dependency of Cozo 0.7.6; no patched compatible release." },
  { id = "RUSTSEC-2026-0249", reason = "Unmaintained transitive dependency of Cozo 0.7.6; no patched compatible release." },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
