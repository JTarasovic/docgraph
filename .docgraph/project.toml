schema_version = 1

[project]
name = "docgraph"

[documents]
root = "docs"
exclude = ["research/**"]

[agent_instructions]
targets = ["AGENTS.md"]

[external_entities]
cache_ttl_seconds = 300

[[external_entities.source]]
provider = "github"
host = "github.com"
token_env = "GITHUB_TOKEN"
token_command = ["gh", "auth", "token"]
timeout_seconds = 10

[query.milestone_blockers]
description = "Explain unresolved blockers for a milestone."
predicate = "milestone_blockers"
arguments = [
  { name = "milestone", mode = "input", type = "entity" },
  { name = "blocker", mode = "output", type = "entity" },
  { name = "reason", mode = "output", type = "string" },
]

[query.next_work]
description = "Find project-level candidates for what to do next."
predicate = "next_work"
arguments = [
  { name = "kind", mode = "output", type = "string" },
  { name = "candidate", mode = "output", type = "entity" },
  { name = "containing_plan", mode = "output", type = "string" },
  { name = "reason", mode = "output", type = "string" },
  { name = "plan", mode = "input", type = "string", default = "" },
]
