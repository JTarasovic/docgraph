[relation.part_of]
description = "The source task contributes to the target plan."
source = ["task"]
target = ["plan"]
inverse = "contains"

[relation.contains]
description = "The source plan contains the target task."
source = ["plan"]
target = ["task"]
inverse = "part_of"

[relation.depends_on]
description = "The source cannot be completed before the target."
source = ["task"]
target = ["task"]
inverse = "required_by"
acyclic = true

[relation.required_by]
description = "The source must be completed before the target."
source = ["task"]
target = ["task"]
inverse = "depends_on"
acyclic = true

[relation.required_for]
description = "The source work must be completed before the target milestone can be reached."
source = ["plan", "task"]
target = ["milestone"]
inverse = "requires"

[relation.requires]
description = "The source milestone cannot be reached before the target work is complete."
source = ["milestone"]
target = ["plan", "task"]
inverse = "required_for"

[relation.implements]
description = "The source performs work required by the target."
source = ["plan", "task"]
target = ["reference", "decision", "section"]
inverse = "implemented_by"

[relation.implemented_by]
description = "The source requirement or decision is implemented by the target work."
source = ["reference", "decision", "section"]
target = ["plan", "task"]
inverse = "implements"

[relation.affects]
description = "The source issue creates friction or risk for the target."
source = ["issue"]
target = ["reference", "decision", "milestone", "plan", "task", "section"]
inverse = "affected_by"

[relation.affected_by]
description = "The source is subject to the target issue."
source = ["reference", "decision", "milestone", "plan", "task", "section"]
target = ["issue"]
inverse = "affects"
