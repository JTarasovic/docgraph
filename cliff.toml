[changelog]
header = """
# Changelog

All notable changes to docgraph are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and versions follow
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).

## [Unreleased]

<!-- git-cliff: end of header -->
"""
header_marker = "<!-- git-cliff: end of header -->"
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}- {{ commit.message | split(pat="\n") | first | upper_first | trim }}
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
filter_commits = false
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Changed" },
  { message = "^chore", group = "Changed" },
  { message = "^ci", group = "Changed" },
  { message = "^test", group = "Changed" },
  { message = ".*", group = "Changed" },
]
sort_commits = "oldest"
