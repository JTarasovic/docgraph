name: Release smoke tests

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  attestations: read
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Verify pinned companion evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release/stage-dist-inputs.sh --verify-attestations

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-*
          path: target/distrib
          merge-multiple: true

      - name: Verify product evidence inputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd target/distrib
          archives=(*.tar.gz *.zip)
          sboms=(*.cdx.xml)
          [[ ${#archives[@]} -eq 2 ]]
          [[ ${#sboms[@]} -gt 0 ]]
          [[ -f sha256.sum ]]
          for archive in "${archives[@]}"; do
            [[ -f "$archive.sha256" ]]
            grep --fixed-strings --quiet "$archive" sha256.sum
          done
          for checksum in *.sha256 sha256.sum; do
            ! grep --extended-regexp --invert-match --quiet \
              '^$|^[0-9a-fA-F]{64} [ *].+$' "$checksum"
            grep --invert-match '^$' "$checksum" | sha256sum --check
          done
          grep --quiet '<name>docgraph-cli</name>' "${sboms[@]}"

      - name: Smoke-test clean archive
        shell: bash
        run: >-
          bash tools/release/smoke-test.sh
          linux-x86_64 "$GITHUB_REF_NAME"
          target/distrib/docgraph-cli-x86_64-unknown-linux-gnu.tar.gz

  windows:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Verify pinned companion evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release/stage-dist-inputs.sh --verify-attestations

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-*
          path: target/distrib
          merge-multiple: true

      - name: Smoke-test clean archive
        shell: bash
        run: >-
          bash tools/release/smoke-test.sh
          windows-x86_64 "$GITHUB_REF_NAME"
          target/distrib/docgraph-cli-x86_64-pc-windows-msvc.zip
