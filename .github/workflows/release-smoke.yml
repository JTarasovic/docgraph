name: Release smoke tests
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            archive: docgraph-cli-x86_64-unknown-linux-gnu.tar.gz
          - runner: windows-2025
            archive: docgraph-cli-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-local-*
          path: target/distrib
          merge-multiple: true
      - name: Smoke-test clean archive
        shell: bash
        env:
          ARCHIVE: target/distrib/${{ matrix.archive }}
          VERSION: ${{ fromJson(inputs.plan).announcement_tag }}
        run: bash tools/release/smoke.sh "$ARCHIVE" "$VERSION"
