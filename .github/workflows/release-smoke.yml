name: Release smoke tests

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  attestations: read
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Verify pinned companion evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release stage --verify-attestations

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-*
          path: target/distrib
          merge-multiple: true

      - name: Verify product evidence and smoke-test archives
        run: cargo xtask release verify-inputs --manifest target/distrib/global-dist-manifest.json --artifacts target/distrib

  windows:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Verify pinned companion evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release stage --verify-attestations

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-*
          path: target/distrib
          merge-multiple: true

      - name: Smoke-test clean archive
        run: cargo xtask release smoke --target windows-x86_64 --version "$GITHUB_REF_NAME" --archive target/distrib/docgraph-cli-x86_64-pc-windows-msvc.zip
