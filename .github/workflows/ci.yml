name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  attestations: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-failures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject invalid release version in installer
        id: invalid-version
        continue-on-error: true
        uses: ./
        with:
          version: not-a-version

      - name: Prepare failing validator
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/docgraph-fails" <<'EOF'
          #!/usr/bin/env bash
          [[ $# -eq 3 && $1 == validate && $2 == --changes && $3 == HEAD ]] || exit 91
          touch "$RUNNER_TEMP/validator-invoked"
          exit 42
          EOF
          chmod +x "$RUNNER_TEMP/docgraph-fails"

      - name: Propagate validator failure
        id: validator-failure
        continue-on-error: true
        uses: ./
        env:
          DOCGRAPH_EXECUTABLE: ${{ runner.temp }}/docgraph-fails
        with:
          install: false
          changes: HEAD

      - name: Reject invalid action working directory
        id: invalid-directory
        continue-on-error: true
        uses: ./
        with:
          install: false
          working-directory: missing-docgraph-directory

      - name: Assert failures occur at their expected layers
        if: always()
        shell: bash
        env:
          INSTALL_RESULT: ${{ steps.invalid-version.outcome }}
          VALIDATOR_RESULT: ${{ steps.validator-failure.outcome }}
          ACTION_RESULT: ${{ steps.invalid-directory.outcome }}
        run: |
          [[ $INSTALL_RESULT == failure ]]
          [[ $VALIDATOR_RESULT == failure ]]
          [[ $ACTION_RESULT == failure ]]
          test -f "$RUNNER_TEMP/validator-invoked"

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve latest stable release
        id: released-docgraph
        uses: cardinalby/git-get-release-action@2ab178299eecb253f820dcf2cce11f62be1178f7 # Node 24
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          repo: JTarasovic/docgraph
          releaseNameRegEx: '^(docgraph )?v?[0-9]+\.[0-9]+\.[0-9]+($| - )'
          draft: false
          prerelease: false

      - name: Install and validate with the public action
        uses: ./
        with:
          version: ${{ steps.released-docgraph.outputs.tag_name }}

      - name: Install pinned development tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: cargo-binstall rust cargo:cargo-deny cargo:cargo-machete cargo:cargo-nextest cargo:cargo-dist cargo:committed
          cache_key: "{{cache_key_prefix}}-{{platform}}-{{file_hash}}"
          cache_save: true

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install packaged logic runtime
        uses: ./install-runtime

      - name: Validate with standalone runtime
        uses: ./
        with:
          install: false

      - name: Run implementation checks
        env:
          DOCGRAPH_CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DOCGRAPH_CHANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: mise run check
