name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      DOCGRAPH_LOGIC_RUNTIME: ${{ github.workspace }}/target/logic-runtime/linux-x86_64/docgraph-logic-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve latest stable release
        id: released-docgraph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Latest release tag is not stable semantic version: $tag" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Smoke-test released validation action
        uses: ./
        with:
          version: ${{ steps.released-docgraph.outputs.tag }}

      - name: Install pinned development tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: cargo-binstall rust cargo:cargo-deny cargo:cargo-machete cargo:cargo-nextest cargo:cargo-dist cargo:committed

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install packaged logic runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/docgraph-logic-runtime.tar.gz"
          gh release download logic-runtime-linux-a1303be3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'docgraph-logic-runtime-linux-x86_64-a1303be3.tar.gz' \
            --output "$archive"
          echo "5f24f24cc95c57cd32518763249281c9c19f21be637dcde3fddf57661536bbe6  $archive" \
            | sha256sum --check
          destination=$(dirname "$DOCGRAPH_LOGIC_RUNTIME")
          mkdir -p "$destination"
          tar -xzf "$archive" --strip-components=1 -C "$destination"

      - name: Run implementation checks
        env:
          DOCGRAPH_CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DOCGRAPH_CHANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: mise run check
