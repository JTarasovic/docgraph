name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned development tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: rust

      - name: Install prebuilt Cargo tools
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          fallback: none
          tool: |
            cargo-nextest@0.9.143
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-machete@0.9.2

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Restore packaged logic runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/logic-runtime/windows-x86_64
          key: windows-logic-runtime-${{ hashFiles('tools/logic-runtime/**') }}

      - name: Run implementation checks
        run: mise run check

      - name: Check dependencies
        run: |
          mise run machete
          mise run audit
          mise run deny
