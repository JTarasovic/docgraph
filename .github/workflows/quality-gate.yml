name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
    # `edited` keeps the gate re-running when only the title changes, so a
    # rejected Conventional Commit subject can be fixed without an empty push.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep runs clear of spurious tool chatter: silence Node's runtime
  # DeprecationWarnings from bundled JavaScript actions and Git's default
  # initial-branch advice emitted by the checkout action's `git init`.
  NODE_OPTIONS: --no-deprecation
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # Consolidates the fast merge gates (Conventional Commit PR title and the
  # validation-action failure-propagation checks) into a single billed job.
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned commit validator
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: cargo-binstall rust cargo:committed
          cache_key: "{{cache_key_prefix}}-{{platform}}-{{file_hash}}"
          cache_save: false

      - name: Reject invalid release version in installer
        id: invalid-version
        continue-on-error: true
        uses: ./
        with:
          version: not-a-version

      - name: Prepare failing validator
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/docgraph-fails" <<'EOF'
          #!/usr/bin/env bash
          [[ $# -eq 3 && $1 == validate && $2 == --changes && $3 == HEAD ]] || exit 91
          touch "$RUNNER_TEMP/validator-invoked"
          exit 42
          EOF
          chmod +x "$RUNNER_TEMP/docgraph-fails"

      - name: Propagate validator failure
        id: validator-failure
        continue-on-error: true
        uses: ./
        env:
          DOCGRAPH_EXECUTABLE: ${{ runner.temp }}/docgraph-fails
        with:
          install: false
          changes: HEAD

      - name: Reject invalid action working directory
        id: invalid-directory
        continue-on-error: true
        uses: ./
        with:
          install: false
          working-directory: missing-docgraph-directory

      - name: Assert failures occur at their expected layers
        if: always()
        shell: bash
        env:
          INSTALL_RESULT: ${{ steps.invalid-version.outcome }}
          VALIDATOR_RESULT: ${{ steps.validator-failure.outcome }}
          ACTION_RESULT: ${{ steps.invalid-directory.outcome }}
        run: |
          [[ $INSTALL_RESULT == failure ]]
          [[ $VALIDATOR_RESULT == failure ]]
          [[ $ACTION_RESULT == failure ]]
          test -f "$RUNNER_TEMP/validator-invoked"

      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          DOCGRAPH_COMMIT_MESSAGE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$DOCGRAPH_COMMIT_MESSAGE" | committed --commit-file -
