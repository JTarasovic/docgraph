name: Windows E2E

on:
  push:
    branches: [main]
    paths:
      - .cargo/**
      - .github/workflows/windows-e2e.yml
      - action.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - fixtures/**
      - mise.toml
      - skills/**
      - tools/action/**
      - tools/logic-runtime/**
  pull_request:
    paths:
      - .cargo/**
      - .github/workflows/windows-e2e.yml
      - action.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - fixtures/**
      - mise.toml
      - skills/**
      - tools/action/**
      - tools/logic-runtime/**

permissions:
  contents: read

concurrency:
  group: windows-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-e2e:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      DOCGRAPH_LOGIC_RUNTIME: ${{ github.workspace }}\target\logic-runtime\windows-x86_64\docgraph-logic-runtime.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve latest stable release
        id: released-docgraph
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name).Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Latest release tag is not stable semantic version: $tag"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag"

      - name: Smoke-test released validation action
        uses: ./
        with:
          version: ${{ steps.released-docgraph.outputs.tag }}

      - name: Install Windows test tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: cargo-binstall rust cargo:cargo-nextest

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install packaged logic runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "docgraph-logic-runtime.zip"
          gh release download logic-runtime-windows-a1303be3 `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "docgraph-logic-runtime-windows-x86_64-a1303be3.zip" `
            --output $archive
          $expected = "65880b97ad4c0242e457917afbce6c59aad1ee6fffa6a9490cd31f62117ee267"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Logic runtime checksum mismatch: expected $expected, got $actual"
          }
          $destination = Split-Path -Parent $env:DOCGRAPH_LOGIC_RUNTIME
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $destination

      - name: Run Windows end-to-end tests
        run: mise run --skip-tools windows-e2e
