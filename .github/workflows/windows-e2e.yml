name: Windows E2E

on:
  push:
    branches: [main]
    paths:
      - .cargo/**
      - .github/workflows/windows-e2e.yml
      - action.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - fixtures/**
      - mise.toml
      - skills/**
      - tools/action/**
      - tools/logic-runtime/**
      - tools/release/**
  pull_request:
    paths:
      - .cargo/**
      - .github/workflows/windows-e2e.yml
      - action.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - fixtures/**
      - mise.toml
      - skills/**
      - tools/action/**
      - tools/logic-runtime/**
      - tools/release/**

permissions:
  attestations: read
  contents: read

concurrency:
  group: windows-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-e2e:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      DOCGRAPH_LOGIC_RUNTIME: ${{ github.workspace }}\target\release-inputs\docgraph-logic-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve latest stable release
        id: released-docgraph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 100 \
            --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Latest release tag is not stable semantic version: $tag" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Smoke-test released validation action
        uses: ./
        with:
          version: ${{ steps.released-docgraph.outputs.tag }}

      - name: Install Windows test tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: cargo-binstall rust cargo:cargo-nextest
          cache_key: "{{cache_key_prefix}}-{{platform}}-{{file_hash}}"
          cache_save: true

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install packaged logic runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release/stage-dist-inputs.sh --verify-attestations

      - name: Run Windows end-to-end tests
        run: mise run --skip-tools windows-e2e
