name: Windows E2E

on:
  push:
    branches: [main]
    paths:
      - .cargo/**
      - .github/workflows/windows-e2e.yml
      - action.yml
      - install/**
      - install-runtime/**
      - Cargo.lock
      - Cargo.toml
      - tools/release/**
      - crates/**
      - fixtures/**
      - mise.toml
      - skills/**
      - tools/logic-runtime/**
  pull_request:
    paths:
      - .cargo/**
      - .github/workflows/windows-e2e.yml
      - action.yml
      - install/**
      - install-runtime/**
      - Cargo.lock
      - Cargo.toml
      - tools/release/**
      - crates/**
      - fixtures/**
      - mise.toml
      - skills/**
      - tools/logic-runtime/**

permissions:
  attestations: read
  contents: read

concurrency:
  group: windows-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-e2e:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve latest stable release
        id: released-docgraph
        uses: cardinalby/git-get-release-action@2ab178299eecb253f820dcf2cce11f62be1178f7 # Node 24
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          repo: JTarasovic/docgraph
          releaseNameRegEx: '^(docgraph )?v?[0-9]+\.[0-9]+\.[0-9]+($| - )'
          draft: false
          prerelease: false

      - name: Install and validate with the public action
        uses: ./
        with:
          version: ${{ steps.released-docgraph.outputs.tag_name }}

      - name: Install Windows test tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: cargo-binstall rust cargo:cargo-nextest
          cache_key: "{{cache_key_prefix}}-{{platform}}-{{file_hash}}"
          cache_save: true

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install packaged logic runtime
        uses: ./install-runtime

      - name: Validate with standalone runtime
        uses: ./
        with:
          install: false

      - name: Run Windows end-to-end tests
        run: mise run --skip-tools windows-e2e
