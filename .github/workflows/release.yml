name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      DOCGRAPH_LOGIC_RUNTIME: ${{ github.workspace }}/target/logic-runtime/linux-x86_64/docgraph-logic-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned development tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pinned logic runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/docgraph-logic-runtime.tar.gz"
          gh release download logic-runtime-linux-a1303be3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'docgraph-logic-runtime-linux-x86_64-a1303be3.tar.gz' \
            --output "$archive"
          echo "5f24f24cc95c57cd32518763249281c9c19f21be637dcde3fddf57661536bbe6  $archive" \
            | sha256sum --check
          destination=$(dirname "$DOCGRAPH_LOGIC_RUNTIME")
          mkdir -p "$destination"
          tar -xzf "$archive" --strip-components=1 -C "$destination"

      - name: Build and package
        shell: pwsh
        run: |
          cargo build --release --locked -p docgraph-cli
          tools/release/package.ps1 `
            -Target linux-x86_64 `
            -Version $env:GITHUB_REF_NAME `
            -CliPath target/release/docgraph `
            -LogicRuntimePath $env:DOCGRAPH_LOGIC_RUNTIME `
            -LogicLicensesPath target/logic-runtime/linux-x86_64/licenses

      - name: Smoke-test clean archive
        shell: pwsh
        run: |
          tools/release/smoke-test.ps1 `
            -Target linux-x86_64 `
            -Version $env:GITHUB_REF_NAME `
            -ArchivePath "target/release-artifacts/docgraph-$env:GITHUB_REF_NAME-linux-x86_64.tar.gz"

      - name: Stage release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      DOCGRAPH_LOGIC_RUNTIME: ${{ github.workspace }}\target\logic-runtime\windows-x86_64\docgraph-logic-runtime.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned development tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pinned logic runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "docgraph-logic-runtime.zip"
          gh release download logic-runtime-windows-a1303be3 `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "docgraph-logic-runtime-windows-x86_64-a1303be3.zip" `
            --output $archive
          $expected = "65880b97ad4c0242e457917afbce6c59aad1ee6fffa6a9490cd31f62117ee267"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Logic runtime checksum mismatch: expected $expected, got $actual"
          }
          $destination = Split-Path -Parent $env:DOCGRAPH_LOGIC_RUNTIME
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $destination

      - name: Build and package
        shell: pwsh
        run: |
          cargo build --release --locked -p docgraph-cli
          tools/release/package.ps1 `
            -Target windows-x86_64 `
            -Version $env:GITHUB_REF_NAME `
            -CliPath target/release/docgraph.exe `
            -LogicRuntimePath $env:DOCGRAPH_LOGIC_RUNTIME `
            -LogicLicensesPath target/logic-runtime/windows-x86_64/licenses

      - name: Smoke-test clean archive
        shell: pwsh
        run: |
          tools/release/smoke-test.ps1 `
            -Target windows-x86_64 `
            -Version $env:GITHUB_REF_NAME `
            -ArchivePath "target/release-artifacts/docgraph-$env:GITHUB_REF_NAME-windows-x86_64.zip"

      - name: Stage release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Collect Linux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: release-assets

      - name: Collect Windows assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "docgraph $GITHUB_REF_NAME" \
            --generate-notes
