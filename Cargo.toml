[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/JTarasovic/docgraph"
license = "MIT"
publish = false

[workspace.dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
getrandom = "0.4.3"
ignore = "0.4.33"
pulldown-cmark = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sqlite-vec = "0.1.9"
toml_edit = { version = "0.25.13", features = ["serde"] }

docgraph-core = { path = "crates/docgraph-core" }
docgraph-markdown = { path = "crates/docgraph-markdown" }
docgraph-logic = { path = "crates/docgraph-logic" }
