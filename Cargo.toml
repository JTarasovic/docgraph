[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/JTarasovic/docgraph"
publish = false

[workspace.dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
cozo = { version = "0.7.6", default-features = false, features = ["graph-algo", "storage-sqlite", "storage-sqlite-src"] }
getrandom = "0.4.3"
ignore = "0.4.33"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml_edit = { version = "0.25.13", features = ["serde"] }

docgraph-core = { path = "crates/docgraph-core" }
docgraph-markdown = { path = "crates/docgraph-markdown" }
docgraph-cozo = { path = "crates/docgraph-cozo" }
